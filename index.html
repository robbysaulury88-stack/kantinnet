<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Barcode Scanner</title>
    <!-- Load library html5-qrcode dari CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: auto; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <h1>Pemindai Barcode & QR Code</h1>
    <div id="reader"></div>
    <div id="result">Hasil scan akan muncul di sini</div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Tampilkan hasil scan pada elemen #result
            document.getElementById('result').innerText = "Hasil: " + decodedText;
            
            // Opsional: Hentikan scanner setelah berhasil scan
            // html5QrcodeScanner.clear();
        }

        function onScanError(errorMessage) {
            // Tangani error kecil saat proses scanning (biasanya diabaikan)
        }

        // Inisialisasi scanner
        var html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, /* verbose= */ false);
        
        html5QrcodeScanner.render(onScanSuccess, onScanError);
    </script>

</body>
</html>
