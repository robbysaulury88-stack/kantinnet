<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner HTTPS Saya</title>
    <!-- Memanggil library scanner via CDN -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; background: white; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        #result { margin-top: 20px; font-weight: bold; color: green; font-size: 18px; }
        .btn-start { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>QR Code Scanner</h1>
    
    <!-- Tombol manual untuk memicu izin kamera jika otomatis gagal -->
    <button class="btn-start" id="start-btn" onclick="mulaiScanner()">Buka Kamera</button>
    
    <!-- Tempat kamera muncul -->
    <div id="reader" style="display: none;"></div>
    
    <!-- Tempat hasil scan muncul -->
    <div id="result"></div>

    <script>
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = `Hasil Scan: <a href="${decodedText}" target="_blank">${decodedText}</a>`;
            
            // Otomatis menuju ke link jika hasil scan berupa URL
            if(decodedText.startsWith('http')) {
                window.location.href = decodedText;
            }
        }

        function onScanFailure(error) {
            // Mengabaikan error pencarian frame kamera
        }

        function mulaiScanner() {
            // Sembunyikan tombol dan tampilkan box kamera
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('reader').style.display = 'block';

            // Inisialisasi scanner dengan konfigurasi ramah perangkat mobile
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 10, 
                    qrbox: 250,
                    rememberLastUsedCamera: true, // Mengingat kamera terakhir yang diizinkan
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] 
                }, 
                false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }
    </script>
</body>
</html>
